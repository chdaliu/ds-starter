<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9743c"/>
      <stop offset="0.55" stop-color="#7a4a22"/>
      <stop offset="1" stop-color="#4d2a10"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c08a4e"/>
      <stop offset="1" stop-color="#8b5a2b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0b0"/>
      <stop offset="0.5" stop-color="#e8b73f"/>
      <stop offset="1" stop-color="#9a6511"/>
    </linearGradient>
  </defs>

  <ellipse cx="64" cy="114" rx="38" ry="7" fill="#000000" opacity="0.28"/>

  <!-- shoulder straps -->
  <path d="M42 35 C34 18, 48 10, 56 20" fill="none" stroke="#3a1d0b" stroke-width="9" stroke-linecap="round"/>
  <path d="M86 35 C94 18, 80 10, 72 20" fill="none" stroke="#3a1d0b" stroke-width="9" stroke-linecap="round"/>
  <path d="M42 35 C34 18, 48 10, 56 20" fill="none" stroke="#6b3f1d" stroke-width="5" stroke-linecap="round"/>
  <path d="M86 35 C94 18, 80 10, 72 20" fill="none" stroke="#6b3f1d" stroke-width="5" stroke-linecap="round"/>

  <!-- bag body -->
  <rect x="20" y="36" width="88" height="72" rx="16" fill="url(#leather)" stroke="#2a0f07" stroke-width="3"/>
  <rect x="27" y="70" width="74" height="31" rx="10" fill="#5e3517" opacity="0.65"/>

  <!-- flap -->
  <path d="M20 52 Q20 34 40 34 L88 34 Q108 34 108 52 L108 68 Q64 79 20 68 Z"
        fill="url(#flap)" stroke="#2a0f07" stroke-width="3"/>
  <path d="M31 50 Q31 42 43 42 L85 42 Q97 42 97 50"
        fill="none" stroke="#e0b06a" stroke-width="2" opacity="0.75"/>

  <!-- clasp -->
  <rect x="57" y="62" width="14" height="26" rx="4" fill="#4a2a12" stroke="#2a0f07" stroke-width="2"/>
  <rect x="53" y="70" width="22" height="13" rx="4" fill="url(#gold)" stroke="#7a4a08" stroke-width="2"/>
  <rect x="58" y="74" width="12" height="5" rx="2" fill="#6b4308" opacity="0.7"/>

  <!-- infinity mark -->
  <circle cx="55" cy="94" r="8.5" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <circle cx="73" cy="94" r="8.5" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <path d="M55 85.5 A8.5 8.5 0 0 1 55 102.5" fill="none" stroke="#fff2b8" stroke-width="1.5" opacity="0.8"/>

  <!-- corner studs -->
  <circle cx="30" cy="60" r="3.2" fill="#c98f3a" stroke="#4a2a12" stroke-width="1.5"/>
  <circle cx="98" cy="60" r="3.2" fill="#c98f3a" stroke="#4a2a12" stroke-width="1.5"/>
</svg>
