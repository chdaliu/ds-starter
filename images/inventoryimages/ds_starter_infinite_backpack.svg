<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b07a44"/>
      <stop offset="0.5" stop-color="#7f4d25"/>
      <stop offset="1" stop-color="#45230e"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c99557"/>
      <stop offset="1" stop-color="#8b5a2b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0b0"/>
      <stop offset="0.5" stop-color="#e8b73f"/>
      <stop offset="1" stop-color="#9a6511"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <ellipse cx="64" cy="114" rx="38" ry="7" fill="#000000" opacity="0.28"/>

  <!-- shoulder straps -->
  <path d="M42 35 C34 18, 48 10, 56 20" fill="none" stroke="#2e1608" stroke-width="10" stroke-linecap="round"/>
  <path d="M86 35 C94 18, 80 10, 72 20" fill="none" stroke="#2e1608" stroke-width="10" stroke-linecap="round"/>
  <path d="M42 35 C34 18, 48 10, 56 20" fill="none" stroke="#6b3f1d" stroke-width="6" stroke-linecap="round"/>
  <path d="M86 35 C94 18, 80 10, 72 20" fill="none" stroke="#6b3f1d" stroke-width="6" stroke-linecap="round"/>

  <!-- bag body -->
  <rect x="18" y="34" width="92" height="76" rx="18" fill="url(#leather)" stroke="#241006" stroke-width="3"/>
  <rect x="25" y="72" width="78" height="31" rx="10" fill="#5b3317" opacity="0.6"/>

  <!-- side pockets -->
  <path d="M18 60 Q10 62 12 74 L12 92 Q14 102 24 102 L30 96 L30 62 Z"
        fill="url(#flap)" stroke="#241006" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M110 60 Q118 62 116 74 L116 92 Q114 102 104 102 L98 96 L98 62 Z"
        fill="url(#flap)" stroke="#241006" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- flap -->
  <path d="M18 52 Q18 32 40 32 L88 32 Q110 32 110 52 L110 70 Q64 82 18 70 Z"
        fill="url(#flap)" stroke="#241006" stroke-width="3"/>
  <path d="M29 50 Q29 41 43 41 L85 41 Q99 41 99 50"
        fill="none" stroke="#e2b271" stroke-width="2" opacity="0.75"/>

  <!-- clasp -->
  <rect x="56" y="60" width="16" height="30" rx="5" fill="#47260f" stroke="#241006" stroke-width="2"/>
  <rect x="51" y="70" width="26" height="15" rx="5" fill="url(#gold)" stroke="#7a4a08" stroke-width="2"/>
  <rect x="57" y="75" width="14" height="5" rx="2" fill="#6b4308" opacity="0.7"/>

  <!-- infinity mark -->
  <circle cx="54" cy="95" r="9" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <circle cx="74" cy="95" r="9" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <path d="M54 86 A9 9 0 0 1 54 104" fill="none" stroke="#fff2b8" stroke-width="1.6" opacity="0.8"/>

  <!-- studs and stitching -->
  <circle cx="27" cy="58" r="3.2" fill="#c98f3a" stroke="#4a2a12" stroke-width="1.5"/>
  <circle cx="101" cy="58" r="3.2" fill="#c98f3a" stroke="#4a2a12" stroke-width="1.5"/>
  <path d="M26 64 Q64 74 102 64" fill="none" stroke="#3a1d0b" stroke-width="1.4" opacity="0.55"/>
</svg>
