<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2f2"/>
      <stop offset="0.42" stop-color="#ff9e9e"/>
      <stop offset="0.78" stop-color="#e04545"/>
      <stop offset="1" stop-color="#8e1c1c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6c2"/>
      <stop offset="0.45" stop-color="#f0c04a"/>
      <stop offset="1" stop-color="#9a6511"/>
    </linearGradient>
    <radialGradient id="gem" cx="0.34" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#ffd6d6"/>
      <stop offset="0.42" stop-color="#e03a3a"/>
      <stop offset="1" stop-color="#5c0707"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-30%" width="220%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- soft cyan aura -->
  <ellipse cx="64" cy="57" rx="25" ry="47" fill="#ff3939" opacity="0.26" filter="url(#glow)"/>

  <!-- blade -->
  <path d="M64 8 L78 31 L74 93 L64 104 L54 93 L50 31 Z"
        fill="url(#blade)" stroke="#4f0707" stroke-width="2" stroke-linejoin="round"/>
  <!-- central ridge -->
  <path d="M64 13 L64 100" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1.5"/>
  <!-- edge highlight -->
  <path d="M64 9 L77 31 L73 90" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1"/>

  <!-- guard -->
  <rect x="36" y="95" width="56" height="10" rx="5"
        fill="url(#gold)" stroke="#654006" stroke-width="2"/>
  <path d="M37 100 L27 93 L29 107 Z" fill="url(#gold)" stroke="#654006" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M91 100 L101 93 L99 107 Z" fill="url(#gold)" stroke="#654006" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- purple gem in the guard -->
  <circle cx="64" cy="100" r="5.6" fill="url(#gem)" stroke="#26043f" stroke-width="1.5"/>
  <circle cx="62.4" cy="98.4" r="1.5" fill="#ffffff" opacity="0.9"/>

  <!-- grip -->
  <rect x="57" y="105" width="14" height="15" rx="3"
        fill="#5a2a18" stroke="#2a0f07" stroke-width="2"/>
  <path d="M58 108 L70 111 M58 112 L70 115 M58 116 L70 119"
        stroke="#e0aa4d" stroke-width="1.4" opacity="0.95"/>

  <!-- pommel -->
  <circle cx="64" cy="122" r="5.6" fill="url(#gold)" stroke="#654006" stroke-width="2"/>
  <circle cx="62.4" cy="120.4" r="1.6" fill="#fff8cf" opacity="0.95"/>
</svg>
