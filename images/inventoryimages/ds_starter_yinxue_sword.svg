<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="blade" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#fff4ef"/>
      <stop offset="0.18" stop-color="#ff9a86"/>
      <stop offset="0.55" stop-color="#d02a22"/>
      <stop offset="0.82" stop-color="#8e1214"/>
      <stop offset="1" stop-color="#520608"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6c2"/>
      <stop offset="0.45" stop-color="#f0c04a"/>
      <stop offset="1" stop-color="#96620f"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4224"/>
      <stop offset="1" stop-color="#3a1a0c"/>
    </linearGradient>
    <radialGradient id="gem" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#ffd9d0"/>
      <stop offset="0.4" stop-color="#e6372c"/>
      <stop offset="1" stop-color="#5a0507"/>
    </radialGradient>
    <filter id="glow" x="-70%" y="-35%" width="240%" height="170%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- soft blood aura -->
  <ellipse cx="62" cy="56" rx="30" ry="46" fill="#ff2b2b" opacity="0.24" filter="url(#glow)"/>

  <!-- curved scimitar blade -->
  <path d="M55 7
           C77 18 89 38 85 60
           C81 80 70 94 55 105
           L46 98
           C60 86 68 70 70 53
           C72 35 64 19 55 7 Z"
        fill="url(#blade)" stroke="#3d0406" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- spine highlight -->
  <path d="M55 10 C70 22 76 37 74 53 C72 69 64 83 53 95"
        fill="none" stroke="#ffd9cf" stroke-opacity="0.55" stroke-width="2"/>
  <!-- cutting-edge highlight -->
  <path d="M84 58 C81 76 72 91 57 103"
        fill="none" stroke="#ff8b78" stroke-opacity="0.55" stroke-width="1.6"/>

  <!-- gold crossguard with curled ends -->
  <path d="M34 99 Q34 93 42 93 L86 93 Q94 93 94 99 Q94 105 86 105 L42 105 Q34 105 34 99 Z"
        fill="url(#gold)" stroke="#654006" stroke-width="2"/>
  <path d="M35 99 C23 99 19 88 28 84 C37 80 41 91 32 94"
        fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
  <path d="M93 99 C105 99 109 88 100 84 C91 80 87 91 96 94"
        fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
  <path d="M35 99 C23 99 19 88 28 84" fill="none" stroke="#654006" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M93 99 C105 99 109 88 100 84" fill="none" stroke="#654006" stroke-width="1.2" stroke-linecap="round"/>

  <!-- red gem in the guard -->
  <circle cx="64" cy="99" r="5.4" fill="url(#gem)" stroke="#3a0406" stroke-width="1.6"/>
  <circle cx="62.2" cy="97.2" r="1.4" fill="#ffffff" opacity="0.9"/>

  <!-- grip and gold wraps -->
  <path d="M57 105 L71 105 L69 119 L59 119 Z"
        fill="url(#grip)" stroke="#2a0f07" stroke-width="2"/>
  <path d="M58 108 L70 110 M58 112 L70 114 M58 116 L69 118"
        stroke="#e0aa4d" stroke-width="1.5" opacity="0.95"/>

  <!-- pommel -->
  <circle cx="64" cy="122" r="5.6" fill="url(#gold)" stroke="#654006" stroke-width="2"/>
  <circle cx="62.3" cy="120.3" r="1.6" fill="#fff8cf" opacity="0.95"/>
</svg>
